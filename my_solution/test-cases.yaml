
test_cases:
  - question: "What was the first verbal report of the Apollo 13 accident from the crew?"
    ground_truth: |
      At 055:55:19, Fred Haise said "Okay, Houston —" followed immediately by Jack Swigert at 055:55:20 stating, "I believe we've had a problem here." Jim Lovell then repeated at 055:55:35, "Houston, we've had a problem. We've had a MAIN B BUS UNDERVOLT."

  - question: "What specific electrical issue was reported immediately after the 'large bang'?"
    ground_truth: |
      The crew reported a "MAIN B BUS UNDERVOLT." Fred Haise noted that there was a "pretty large bang associated with the CAUTION AND WARNING" and recalled that Main B had experienced an "amp spike on it once before."

  - question: "What were the call signs used for the Command Service Module (CSM) and the Lunar Module (LM) when both were manned?"
    ground_truth: |
      According to the station operating procedures in the transcript, when both vehicles were manned, the call sign for the CSM was "Odyssey" and the call sign for the LM was "Aquarius."

  - question: "What did Jim Lovell observe looking out the window shortly after the oxygen tank failure?"
    ground_truth: |
      At 056:09:07, Jim Lovell reported to Houston, "We are venting something out into the—into space. It's a gas of some sort."

  - question: "Which oxygen tank quantity was reported as reading zero or 'fullscale high' following the incident?"
    ground_truth: |
      Fred Haise initially reported that O2 QUANTITY 2 was oscillating between 20 and 60 percent before going "fullscale high." Later, at 056:08:57, Jim Lovell confirmed, "our O2 quantity number 2 tank is reading zero."

  - question: "What was the status of the center engine (engine 5) during the S-II boost phase?"
    ground_truth: |
      At 000:06:10, Jim Lovell asked, "what's the story on engine 5?" CapCom replied that they did not know why the "inboard out was early," but confirmed the other engines were still GO.

  - question: "What instructions did Houston give regarding the fuel cells immediately after the undervolt was detected?"
    ground_truth: |
      At 056:00:35, Houston (CapCom Jack Lousma) instructed the crew to "attempt to reconnect fuel cell 1 to MAIN A and fuel cell 3 to MAIN B."

  - question: "What did the crew report regarding the Service Module RCS helium and propellant indicators?"
    ground_truth: |
      The crew reported that for Service Module RCS HELIUM 1, "B is barber poled and D is barber poled." For HELIUM 2, "D is barber pole," and for SECONDARY PROPELLANTS, "A and C [are] barber pole."

  - question: "What were the names and roles of the three Apollo 13 crew members identified in the transcript?"
    ground_truth: |
      The transcript identifies the crew as CDR (Commander) James A. Lovell, Jr., CMP (Command Module Pilot) John L. Swigert, Jr., and LMP (Lunar Module Pilot) Fred W. Haise, Jr.

  - question: "What was the reported status of Fuel Cell 1 nitrogen and Fuel Cell 3 oxygen pressures?"
    ground_truth: |
      At 056:06:57, Fred Haise reported that "Fuel cell 1 nitrogen reads zero" and at 056:06:44, he reported that "2 Baker, which is 3 oxygen, says 0.6."

  # - question: "What was the role of the Lunar Module Pilot, Fred W. Haise, Jr., during the mission?"
  #   ground_truth: |
  #     As the Lunar Module Pilot (LMP), Fred Haise was responsible for the systems and operation of the Lunar Module (LM), Aquarius. While originally intended to pilot the LM to the lunar surface at Fra Mauro, his role shifted after the explosion to managing the LM's life support and propulsion systems, effectively turning the LM into a 'lifeboat' to sustain the three-man crew.

  # - question: "How did the Capsule Communicator (CAP COMM) contribute to communication between the spacecraft and Mission Control?"
  #   ground_truth: |
  #     The CAPCOM acted as the primary and often sole voice communicating with the astronauts to ensure clarity and minimize confusion. During Apollo 13, various CAPCOMs (including Jack Lousma and Ken Mattingly) relayed critical, newly-developed procedures from the back-room engineers to the crew, such as the CO2 scrubber 'mailbox' build and the Command Module power-up sequence.

  # - question: "What was the significance of the Primary Guidance and Navigation System (PGNS) checklist page 57 during the mission?"
  #   ground_truth: |
  #     Page 57 of the LM Malfunction Procedures checklist contained troubleshooting steps for warning lights and system failures. This specific page is historically significant as it was used by the crew during the crisis to manage the transition of power and control systems from the failing Command Module to the Lunar Module.

  # - question: "How did the astronauts handle technical challenges, such as using the Alinement Optical Telescope (AOT) lamps to shoot the Sun?"
  #   ground_truth: |
  #     Due to a debris cloud of frozen oxygen and insulation following the explosion, the astronauts could not see stars for traditional navigation. They improvised by using the AOT to 'shoot the Sun'—using the Sun's limb as a reference point to verify the spacecraft's alignment for critical engine burns, such as the PC+2 burn to return to a free-return trajectory.

  # - question: "What were some of the key decisions made by Commander James A. Lovell, Jr., during the mission?"
  #   ground_truth: |
  #     Commander Lovell made several pivotal decisions, including the immediate transition of the crew into the Lunar Module after the Command Module lost power. He also manually controlled the spacecraft's attitude during the critical mid-course correction burns, relying on visual cues like the Earth and Sun because the automated guidance systems were powered down to conserve energy.

  # - question: "How did the crew interact with Mission Control in resolving issues and ensuring the safety of the mission?"
  #   ground_truth: |
  #     The interaction was one of intensive collaboration and 'working the problem.' Mission Control provided the mathematical calculations and procedural innovations (like the lithium hydroxide canister adapter), while the crew executed these steps in a freezing, high-stress environment, providing constant feedback on system status and cabin conditions.

  # - question: "What were the main objectives of the Apollo 13 mission and how were they impacted by the unexpected events that occurred?"
  #   ground_truth: |
  #     The primary objective was to land in the Fra Mauro Highlands to conduct geological surveys and deploy scientific instruments. These objectives were completely aborted after the oxygen tank explosion; the mission's sole objective became the safe return of the crew to Earth, making it a 'successful failure.'

  # - question: "How did the crew's training and preparation prior to the mission influence their ability to respond to emergencies and adapt to changing circumstances?"
  #   ground_truth: |
  #     The crew’s extensive training in simulators for 'non-nominal' scenarios allowed them to remain calm and methodical. Their deep understanding of the spacecraft systems enabled them to execute unpracticed procedures—like powering up a cold Command Module—with high precision under extreme physical and mental fatigue.

  # - question: "What lessons were learned from the Apollo 13 mission that influenced future space missions and astronaut training?"
  #   ground_truth: |
  #     NASA implemented several hardware changes, including adding a third oxygen tank in a different location and an auxiliary battery. Procedurally, the mission emphasized the importance of ground-based simulators for real-time crisis management and reinforced the 'team-of-teams' approach to problem-solving that became a hallmark of future Shuttle and ISS operations.

  # - question: "How did the teamwork and collaboration among the crew members contribute to the successful outcome of the mission despite the challenges faced?"
  #   ground_truth: |
  #     The survival was a result of disciplined teamwork where each member managed specific areas: Swigert handled Command Module shut-down/start-up, Haise managed the LM systems, and Lovell provided overall command and manual piloting. This division of labor, supported by the tireless work of Mission Control, allowed them to solve complex, overlapping failures that would have overwhelmed a less synchronized team.

  # - question: "Who were the crew members of the Apollo 13?"
  #   ground_truth: |
  #     The crew members of the Apollo 13 mission were Jim Lovell, Jack Swigert, and Fred Haise 